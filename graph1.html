<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Âge moyen des employés par département</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.24.2/plotly.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #graph {
            width: 100%;
            height: 500px;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h1>Âge moyen des employés par département</h1>
    <div id="graph"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Données pour le graphique
            const departements = ['Développement', 'Finances', 'Ressources Humaines', 'Soutien', 'Ventes'];
            const ageMoyen = [32, 34, 40, 34, 29];
            
            // Couleurs correspondant à l'image originale
            const couleurs = ['#3366cc', '#ffd966', '#57bb8a', '#e06666', '#8e7cc3'];
            
            // Configuration du graphique
            const trace = {
                x: departements,
                y: ageMoyen,
                type: 'bar',
                marker: {
                    color: couleurs
                }
            };
            
            const layout = {
                title: '',
                yaxis: {
                    title: 'Âge moyen',
                    range: [0, 45],
                    dtick: 5
                },
                xaxis: {
                    title: 'Département'
                },
                margin: {
                    l: 50,
                    r: 50,
                    t: 50,
                    b: 80
                }
            };
            
            // Création du graphique
            Plotly.newPlot('graph', [trace], layout);
        });
    </script>
</body>
</html>
